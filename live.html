<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live page</title>
  <style>
    body { margin:0; min-height:100dvh; background:#f2ead8; color:#1b140c; font-family: Georgia, serif; }
    main { margin:0 auto; min-height:100dvh; max-width:36rem; padding:2.5rem 1.5rem;
      display:flex; flex-direction:column; justify-content:space-between; }
    .city { letter-spacing:.22em; text-transform:uppercase; font-size:.8rem; color:#7a5a32; }
    h1 { font-size:clamp(3rem,12vw,5.5rem); line-height:.9; letter-spacing:-.04em; margin:4rem 0 0; }
    .offer { margin-top:2rem; max-width:28rem; font-size:1.15rem; line-height:1.7; color:#3a2c1d; }
    .actions { display:grid; gap:.75rem; }
    a.call, a.wa { display:flex; height:3.5rem; align-items:center; justify-content:center;
      border-radius:999px; text-decoration:none; }
    a.call { background:#1b140c; color:#f2ead8; }
    a.wa { border:1px solid rgba(27,20,12,.2); color:#1b140c; }
    .note { text-align:center; font-size:.75rem; color:#7a5a32; padding-top:1rem; }
    .empty { max-width:36rem; margin:4rem auto; padding:0 1.5rem; }
    .empty a { color:#7a5a32; }
  </style>
</head>
<body>
  <p class="empty" id="empty">Nothing here. <a href="./">Back to the night desk</a></p>
  <script src="./shop.js?v=20260906i"></script>
  <script>
  (function () {
    var brief = NightDesk.decode(location.hash);
    if (!brief) return;
    document.title = brief.businessName;
    var empty = document.getElementById("empty");
    if (empty) empty.remove();
    NightDesk.renderShop(document.body, brief);
  })();
  </script>
</body>
</html>
