# Hourly: overwrite grey catalog /assets/nav.js (cash_120 only).
# Empty secrets → exit 0. Does not replace grok / grok-cf.
# ping 2026-09-20T05:12Z: 05:12 mid-window — 05:00-05:20 OPEN; last Fileman 01:43 6s skip — Fileman now if RUN-SHIFT002 set CPANEL_TOKEN.
# ping 2026-09-20T05:00Z: odd-hour door — 05:00-05:20 OPEN; last Fileman 01:43 5s skip — Fileman now if RUN-SHIFT002 set CPANEL_TOKEN.
# ping 2026-09-20T04:18Z: 04:18 closing window — 04:00-04:20 OPEN; last Fileman 01:43 7s skip — Fileman now if RUN-SHIFT002 set CPANEL_TOKEN.
name: put-catalog-nav
on:
  workflow_dispatch:
  schedule:
    - cron: "25 * * * *"
  push:
    branches: ["main"]
    paths:
      - "ftp-drop/nav-night.js"
      - ".github/workflows/put-catalog-nav.yml"
jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          exit 0
