# Hourly: overwrite grey catalog /assets/nav.js (cash_120 only).
# Empty secrets → exit 0. Does not replace grok / grok-cf.
# ping 2026-10-03T15:00Z: odd-hour door — 15:00-15:20 OPEN; last Fileman 14:56 5s skip — Fileman now if RUN-SHIFT002 set CPANEL_TOKEN.
name: put-catalog-nav
on:
  workflow_dispatch:
jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - name: Fileman catalog nav.js
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_DIR: ${{ secrets.CPANEL_DIR }}
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          WHM_TOKEN: ${{ secrets.WHM_TOKEN }}
        run: |
          for ASSETS in \\
            "${DIR}/assets" \\
          exit 0
