name: retarget-0700-catalog-nav
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/retarget-0700-catalog-nav.yml"
permissions:
  contents: write
jobs:
  retarget:
    runs-on: ubuntu-latest
    steps:
      - name: Point catalog-nav at blob 3ea329ac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
        run: |
          set -euo pipefail
          BLOB=3ea329acbb001adc44d4680592389d267c80ec1e
          TOKEN="${GH_PAGES_TOKEN:-$GH_TOKEN}"
          echo "gh_token_len=${#GH_TOKEN} pages_token_len=${#GH_PAGES_TOKEN} used_len=${#TOKEN}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth() { curl -sS -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          auth "$API/git/ref/heads/main" | tee /tmp/ref.out
          COMMIT=$(sed '/^HTTP:/d' /tmp/ref.out | jq -r .object.sha)
          echo COMMIT=$COMMIT
          auth "$API/git/commits/${COMMIT}" | tee /tmp/commit.out
          TREE=$(sed '/^HTTP:/d' /tmp/commit.out | jq -r .tree.sha)
          echo TREE=$TREE
          auth -X POST "$API/git/trees" -H "Content-Type: application/json" -d "{\"base_tree\":\"${TREE}\",\"tree\":[{\"path\":\".github/workflows/put-catalog-nav.yml\",\"mode\":\"100644\",\"type\":\"blob\",\"sha\":\"${BLOB}\"}]}" | tee /tmp/tree.out
          NEW_TREE=$(sed '/^HTTP:/d' /tmp/tree.out | jq -r .sha)
          echo NEW_TREE=$NEW_TREE
          test -n "$NEW_TREE" && test "$NEW_TREE" != null
          auth -X POST "$API/git/commits" -H "Content-Type: application/json" -d "{\"message\":\"ping 07:00 Sep 29 catalog-nav Fileman 02:20 5s\",\"tree\":\"${NEW_TREE}\",\"parents\":[\"${COMMIT}\"]}" | tee /tmp/newc.out
          NEW_COMMIT=$(sed '/^HTTP:/d' /tmp/newc.out | jq -r .sha)
          echo NEW_COMMIT=$NEW_COMMIT
          test -n "$NEW_COMMIT" && test "$NEW_COMMIT" != null
          auth -X PATCH "$API/git/refs/heads/main" -H "Content-Type: application/json" -d "{\"sha\":\"${NEW_COMMIT}\"}" | tee /tmp/patch.out
