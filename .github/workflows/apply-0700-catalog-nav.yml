name: apply-0700-catalog-nav
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-0700-catalog-nav.yml"
permissions:
  contents: write
  issues: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Write exact catalog-nav
        env:
          GH_TOKEN: ${{ secrets.GH_PAGES_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "token_len=${#GH_TOKEN} actor=${GITHUB_ACTOR}"
            echo "gh_pages_present=$([ -n '${{ secrets.GH_PAGES_TOKEN }}' ] && echo yes || echo no)"
            curl -fsSL https://paste.rs/AhZxR -o .github/workflows/put-catalog-nav.yml
            echo "curl_exit=$?"
            echo "bytes=$(wc -c < .github/workflows/put-catalog-nav.yml)"
            echo "blob=$(git hash-object .github/workflows/put-catalog-nav.yml)"
            export B64=$(base64 -w0 .github/workflows/put-catalog-nav.yml)
            META=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/put-catalog-nav.yml?ref=main")
            echo "meta=$META"
            export SHA=$(echo "$META" | jq -r .sha)
            echo "current_sha=$SHA"
            python3 - <<'PY'
          import json, os, urllib.request
          sha=os.environ.get("SHA","")
          b64=os.environ.get("B64","")
          token=os.environ["GH_TOKEN"]
          repo=os.environ["GITHUB_REPOSITORY"]
          body=json.dumps({"message":"ping 07:00 Sep 29 catalog-nav Fileman 02:20 5s","content":b64,"sha":sha,"branch":"main"})
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/contents/.github/workflows/put-catalog-nav.yml", data=body.encode(), method="PUT", headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","Content-Type":"application/json"})
          try:
            with urllib.request.urlopen(req, timeout=60) as r:
              print("PUT", r.status, r.read()[:400])
          except Exception as e:
            print("PUT_ERR", e)
            if hasattr(e, "read"):
              print(e.read()[:1000])
          PY
          } 2>&1 | tee /tmp/dump.txt
          PASTE=$(curl -sS --data-binary @/tmp/dump.txt https://paste.rs/ || true)
          echo PASTE=$PASTE | tee -a /tmp/dump.txt
          jq -n --arg t "apply-dump $GITHUB_RUN_ID" --arg b "$(cat /tmp/dump.txt)" '{title:$t,body:$b}' > /tmp/issue.json
          curl -sS -H "Authorization: Bearer ${ISSUE_TOKEN}" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" --data-binary @/tmp/issue.json
          grep -E 'PUT 200|PUT 201' /tmp/dump.txt
