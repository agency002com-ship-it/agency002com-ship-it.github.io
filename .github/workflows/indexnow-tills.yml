# Ping IndexNow for doors that already sell same-night.
# No secrets. Do not submit https://120.cash/ while it still says one working day.
name: indexnow-tills
on:
  workflow_dispatch:
  schedule:
    - cron: "40 * * * *"
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: IndexNow orange tills; 120.cash only if already same-night
        run: |
          python3 - <<'PY'
          import json, urllib.request
          KEY = "7c2a9f1e4b8d0c3a5e6f7a8b9c0d1e2f"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Shift002IndexNow/1.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read().decode("utf-8", "replace")

          def ping(host, path="/"):
              body = json.dumps({
                  "host": host,
                  "key": KEY,
                  "keyLocation": f"https://{host}/{KEY}.txt",
                  "urlList": [f"https://{host}{path}"],
              }).encode()
              req = urllib.request.Request(
                  "https://api.indexnow.org/indexnow",
                  data=body,
                  headers={"content-type": "application/json; charset=utf-8"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  print(host, r.status)

          for host in ("tonight.agency002.com", "cash.120.cash"):
              try:
                  ping(host)
              except Exception as e:
                  print(host, "fail", e)

          try:
              page = get("https://120.cash/")
          except Exception as e:
              print("120.cash fetch fail", e)
              page = ""
          if page and "#book" in page and "one working day" not in page:
              try:
                  ping("120.cash")
              except Exception as e:
                  print("120.cash IndexNow fail", e)
          else:
              print("skip 120.cash IndexNow (still wait-a-day or fetch failed)")
          PY
