# Ping IndexNow for doors that already sell same-night.
# One host per POST (mixed-host 422). No secrets.
# Do not submit https://120.cash/ while it still says one working day.
# ping 2026-09-08T08:51Z: leftover GitHub cron 40 * * * * missed 06:40/07:40/08:40. Add 10 * * * *.
# ping 2026-09-08T08:32Z: leftover same-night extra orange hosts only IndexNowed / — use converting paths.
# ping 2026-09-08T08:29Z: leftover cash.keychain.gr CONVERTING only / and pay.html — till also serves tonight/el/apopse/120cash.
# ping 2026-09-07T22:47Z: CONVERTING sitemap/llms/feed on tonight.120.cash + cash/pay tills
# ping 2026-09-07T22:16Z: converting paths only — no neighbourhood github.io IndexNow.
# ping 2026-09-07T21:48Z: pay.120.cash checkout + converting 120cash.html/apopse.html (no neighbourhood add).
# ping 2026-09-07T14:42Z: llms.txt with Greek neighbourhood tills
# ping 2026-09-07T14:32Z: sitemap.xml + feed.xml with neighbourhood tills
# ping 2026-09-07T09:53Z: grok-cf.eid-ot-evil.workers.dev + remaining orange tills
# ping 2026-09-07T09:43Z: 09:40 schedule missing (last schedule 07:31); force chain
# ping 2026-09-07T09:26Z: Marousi + Zografou + Koukaki github.io tills
# ping 2026-09-07T08:50Z: Pangrati + Galatsi github.io tills
# ping 2026-09-07T08:42Z: Fileman follows this run via put-120cash-cron workflow_run
# ping 2026-09-07T08:33Z: Nea Ionia + Patissia github.io tills
name: indexnow-tills
on:
  workflow_dispatch:
  schedule:
    - cron: "40 * * * *"
    - cron: "10 * * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/indexnow-tills.yml"
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: IndexNow orange tills; 120.cash only if already same-night
        run: |
          python3 - <<'PY'
          import json, urllib.request
          KEY = "7c2a9f1e4b8d0c3a5e6f7a8b9c0d1e2f"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          CANDIDATES = (
              "tonight.agency002.com",
              "cash.agency002.com",
              "order.agency002.com",
              "get.agency002.com",
              "now.agency002.com",
              "book.agency002.com",
              "desk.agency002.com",
              "live.agency002.com",
              "cash.120.cash",
              "pay.120.cash",
              "tonight.120.cash",
              "shop.120.cash",
              "apopse.120.cash",
              "now.120.cash",
              "book.120.cash",
              "cash.keychain.gr",
              "now.keychain.gr",
              "book.keychain.gr",
              "now.sebarv.com",
              "book.sebarv.com",
              "grok-cf.eid-ot-evil.workers.dev",
          )

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read().decode("utf-8", "replace")

          def same_night(page):
              return bool(page) and ("#book" in page or 'id="book"' in page) and "one working day" not in page.lower()

          def ping(host, paths):
              body = json.dumps({
                  "host": host,
                  "key": KEY,
                  "keyLocation": "https://{0}/{1}.txt".format(host, KEY),
                  "urlList": ["https://{0}{1}".format(host, p) for p in paths],
              }).encode()
              req = urllib.request.Request(
                  "https://api.indexnow.org/indexnow",
                  data=body,
                  headers={"content-type": "application/json; charset=utf-8"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  print(host, paths, r.status)

          for host in CANDIDATES:
              try:
                  page = get("https://{0}/".format(host))
              except Exception as e:
                  print(host, "fetch fail", e)
                  continue
              if not same_night(page):
                  print(host, "skip (not same-night)")
                  continue
              # leftover: extra same-night orange hosts (cash.agency002.com, shop.120.cash, now.keychain.gr) only IndexNowed "/".
              paths = ["/", "/120cash.html", "/apopse.html", "/tonight.html", "/el.html", "/pay.html?plan=cash_120", "/sitemap.xml", "/llms.txt", "/feed.xml"]
              try:
                  ping(host, paths)
              except Exception as e:
                  print(host, "fail", e)

          try:
              page = get("https://120.cash/")
          except Exception as e:
              print("120.cash fetch fail", e)
              page = ""
          if same_night(page):
              try:
                  ping("120.cash", ["/"])
              except Exception as e:
                  print("120.cash IndexNow fail", e)
          else:
              print("skip 120.cash IndexNow (still wait-a-day or fetch failed)")

          gio_host = "agency002com-ship-it.github.io"
          GIO_PATHS = (
              "/",
              "/120cash.html",
              "/apopse.html",
              "/tonight.html",
              "/el.html",
          )
          live = []
          for path in GIO_PATHS:
              try:
                  page = get("https://{0}{1}".format(gio_host, path))
              except Exception as e:
                  print("github.io{0} fetch fail".format(path), e)
                  continue
              converting = "pay.120.cash/pay.html?plan=cash_120" in page and "one working day" not in page.lower()
              if same_night(page) or converting:
                  live.append(path)
              else:
                  print("skip github.io{0} (not same-night)".format(path))
          extras = []
          for path in ("/sitemap.xml", "/feed.xml", "/llms.txt"):
              try:
                  get("https://{0}{1}".format(gio_host, path))
                  extras.append(path)
              except Exception as e:
                  print("github.io{0} fetch fail".format(path), e)
          if live or extras:
              try:
                  ping(gio_host, live + extras)
              except Exception as e:
                  print("github.io IndexNow fail", e)
          else:
              print("skip github.io (no same-night paths)")
          PY
