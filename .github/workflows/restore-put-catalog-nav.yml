name: restore-put-catalog-nav
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflow-src/put-catalog-nav.0700.yml.gz.b64"
      - ".github/workflow-src/restore-put-catalog-nav.py"
      - ".github/workflows/restore-put-catalog-nav.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore via Contents API
        env:
          GH_TOKEN: ${{ secrets.GH_PAGES_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "restore0700 token_len=${#GH_TOKEN} actor=${GITHUB_ACTOR}"
          python3 .github/workflow-src/restore-put-catalog-nav.py
