name: restore-put-catalog-nav
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflow-src/put-catalog-nav.1618.yml.gz.b64"
      - ".github/workflow-src/restore-put-catalog-nav.py"
      - ".github/workflows/restore-put-catalog-nav.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode full put-catalog-nav.yml and commit
        run: |
          set -euo pipefail
          python3 .github/workflow-src/restore-put-catalog-nav.py
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add .github/workflows/put-catalog-nav.yml
          if git diff --cached --quiet; then
            echo unchanged
            exit 0
          fi
          git commit -m 'restore put-catalog-nav.yml full 105220'
          git pull --rebase origin main || true
          git push
