# Flip 120.cash to the same-night door, keychain cash_120 to paid.html,
# and indexed catalog €120 cards (eidotevil / agency002 / sebarv) to tonight.agency002.com/#book.
# Secrets (optional): CLOUDFLARE_API_TOKEN, CPANEL_TOKEN,
# CPANEL_HOST (defaults to 192.250.229.162), CPANEL_USER (defaults to agency00), CPANEL_DIR
# ping 2026-09-07T05:45Z: parse-guard orange-120cash.ps1 closed Write-Host + grok-cf reclaim.
# Unique HTML needle src="/assets/nav.js?v=2" also points at github.io night nav.
# Empty secrets → exit 0 (laptop still runs install-hub-hook.ps1).
# Does not replace Workers grok / grok-cf. Does not rewrite other keychain plans
# or eidotevil presence / page_100 / Printful.
name: put-120cash
on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"
  push:
    branches: ["main"]
    paths:
      - "ftp-drop/*"
      - "ftp-drop/**"
      - ".github/workflows/put-120cash.yml"
jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard PowerShell pack parses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t = Path("ftp-drop/upload-120cash.ps1").read_text()
          if " or $js.Contains" in t:
              raise SystemExit("upload-120cash.ps1 has invalid PowerShell `or` — laptop Fileman would abort")
          if "-or $js.Contains" not in t:
              raise SystemExit("upload-120cash.ps1 missing -or nav check")
          if "domains/120.cash/public_html" not in t:
              raise SystemExit("upload-120cash.ps1 default dir is not the live addon docroot")
          o = Path("ftp-drop/orange-120cash.ps1").read_text()
          if "Write-Host 'Done. Origin /assets/, /api/, and other keychain plans still pass through.'" not in o:
              raise SystemExit("orange-120cash.ps1 last Write-Host is unclosed or missing — laptop orange would abort")
          if "will not steal grok-cf" not in o or "Get-RouteScript" not in o:
              raise SystemExit("orange-120cash.ps1 missing grok-cf reclaim")
          print("upload-120cash.ps1 + orange-120cash.ps1 parse guard OK")
          PY
