# Flip 120.cash to the same-night door, keychain cash_120 to paid.html,
# and the agency002.com €120 card to cash.agency002.com/#book.
# Secrets (optional): CLOUDFLARE_API_TOKEN, CPANEL_HOST, CPANEL_USER, CPANEL_TOKEN, CPANEL_DIR
# Empty secrets → exit 0 (laptop still runs install-hub-hook.ps1).
# Does not replace Workers grok / grok-cf. Does not rewrite other keychain plans
# or agency002 presence / Printful / DBYW.
name: put-120cash
on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"
  push:
    branches: ["main"]
    paths:
      - "ftp-drop/**"
      - ".github/workflows/put-120cash.yml"
jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe live doors
        id: door
        run: |
          set -euo pipefail
          page="$(curl -fsSL https://120.cash/ || true)"
          if echo "$page" | grep -q '#book' && ! echo "$page" | grep -q 'one working day'; then
            echo "120.cash already same-night."
            echo "cash=yes" >> "$GITHUB_OUTPUT"
          else
            echo "120.cash still wait-a-day."
            echo "cash=no" >> "$GITHUB_OUTPUT"
          fi
          pay="$(curl -fsSL https://keychain.gr/pay.html || true)"
          if echo "$pay" | grep -q 'github.io/paid.html' && ! echo "$pay" | grep -Fq "a('https://120.cash/#brief'"; then
            echo "keychain cash_120 already night bounce."
            echo "pay=yes" >> "$GITHUB_OUTPUT"
          else
            echo "keychain cash_120 still 120.cash/#brief."
            echo "pay=no" >> "$GITHUB_OUTPUT"
          fi
          agency="$(curl -fsSL https://agency002.com/ || true)"
          if echo "$agency" | grep -Fq 'cash.agency002.com/#book' || echo "$agency" | grep -Fq 'now.agency002.com/#book'; then
            echo "agency002.com €120 card already same-night."
            echo "agency=yes" >> "$GITHUB_OUTPUT"
          else
            echo "agency002.com €120 card still keychain wait-a-day."
            echo "agency=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Cloudflare orange-cloud
        if: ${{ steps.door.outputs.cash != 'yes' || steps.door.outputs.pay != 'yes' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x ftp-drop/orange-120cash.sh
          ftp-drop/orange-120cash.sh
      - name: Fileman save 120.cash index.html
        if: steps.door.outputs.cash != 'yes'
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_DIR: ${{ secrets.CPANEL_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${CPANEL_TOKEN:-}" ] || [ -z "${CPANEL_HOST:-}" ]; then
            echo "No CPANEL_TOKEN/HOST secret. Skip Fileman."
            exit 0
          fi
          USER="${CPANEL_USER:-agency00}"
          DIR="${CPANEL_DIR:-/home/${USER}/120.cash}"
          HTML="$(cat ftp-drop/120-index.html)"
          AUTH="$(printf '%s:%s' "$USER" "$CPANEL_TOKEN" | base64 | tr -d '\n')"
          curl -fsS -k -X POST "https://${CPANEL_HOST}:2083/execute/Fileman/save_file_content" \
            -H "Authorization: Basic ${AUTH}" \
            --data-urlencode "dir=${DIR}" \
            --data-urlencode "file=index.html" \
            --data-urlencode "content=${HTML}" \
            --data-urlencode "charset=utf-8" || echo "WARN :2083 Fileman failed"
          WHM_USER="${CPANEL_USER:-agency00}"
          curl -sS -k -X POST "https://${CPANEL_HOST}:2087/json-api/cpanel" \
            -H "Authorization: WHM ${WHM_USER}:${CPANEL_TOKEN}" \
            --data "cpanel_jsonapi_user=${USER}" \
            --data "cpanel_jsonapi_apimodule=Fileman" \
            --data "cpanel_jsonapi_apifunc=save_file_content" \
            --data "cpanel_jsonapi_version=2" \
            --data-urlencode "dir=${DIR}" \
            --data-urlencode "file=index.html" \
            --data-urlencode "content=${HTML}" \
            --data "charset=utf-8" >/dev/null || echo "WARN :2087 Fileman failed"
      - name: Fileman patch keychain cash_120
        if: steps.door.outputs.pay != 'yes'
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CPANEL_TOKEN:-}" ] || [ -z "${CPANEL_HOST:-}" ]; then
            echo "No CPANEL_TOKEN/HOST secret. Skip keychain Fileman."
            exit 0
          fi
          USER="${CPANEL_USER:-agency00}"
          if ! curl -fsSL https://keychain.gr/pay.html | python3 ftp-drop/patch-keychain.py > /tmp/pay.html; then
            echo "Needles not unique or other plans would drop. Skip origin write."
            exit 0
          fi
          AUTH="$(printf '%s:%s' "$USER" "$CPANEL_TOKEN" | base64 | tr -d '\n')"
          HTML="$(cat /tmp/pay.html)"
          for DIR in "/home/${USER}/keychain.gr" "/home/${USER}/public_html/keychain.gr" "/home/${USER}/domains/keychain.gr/public_html"; do
            curl -fsS -k -X POST "https://${CPANEL_HOST}:2083/execute/Fileman/save_file_content" \
              -H "Authorization: Basic ${AUTH}" \
              --data-urlencode "dir=${DIR}" \
              --data-urlencode "file=pay.html" \
              --data-urlencode "content=${HTML}" \
              --data-urlencode "charset=utf-8" || echo "WARN :2083 $DIR"
            curl -sS -k -X POST "https://${CPANEL_HOST}:2087/json-api/cpanel" \
              -H "Authorization: WHM ${USER}:${CPANEL_TOKEN}" \
              --data "cpanel_jsonapi_user=${USER}" \
              --data "cpanel_jsonapi_apimodule=Fileman" \
              --data "cpanel_jsonapi_apifunc=save_file_content" \
              --data "cpanel_jsonapi_version=2" \
              --data-urlencode "dir=${DIR}" \
              --data-urlencode "file=pay.html" \
              --data-urlencode "content=${HTML}" \
              --data "charset=utf-8" >/dev/null || echo "WARN :2087 $DIR"
          done
      - name: Fileman patch agency002.com €120 card
        if: steps.door.outputs.agency != 'yes'
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CPANEL_TOKEN:-}" ] || [ -z "${CPANEL_HOST:-}" ]; then
            echo "No CPANEL_TOKEN/HOST secret. Skip agency002 Fileman."
            exit 0
          fi
          USER="${CPANEL_USER:-agency00}"
          if ! curl -fsSL https://agency002.com/ | python3 ftp-drop/patch-agency.py > /tmp/agency.html; then
            echo "Needles not unique or other products would drop. Skip brand rewrite."
            exit 0
          fi
          AUTH="$(printf '%s:%s' "$USER" "$CPANEL_TOKEN" | base64 | tr -d '\n')"
          HTML="$(cat /tmp/agency.html)"
          for DIR in "/home/${USER}/public_html" "/home/${USER}/agency002.com" "/home/${USER}/public_html/agency002.com"; do
            curl -fsS -k -X POST "https://${CPANEL_HOST}:2083/execute/Fileman/save_file_content" \
              -H "Authorization: Basic ${AUTH}" \
              --data-urlencode "dir=${DIR}" \
              --data-urlencode "file=index.html" \
              --data-urlencode "content=${HTML}" \
              --data-urlencode "charset=utf-8" || echo "WARN :2083 $DIR"
            curl -sS -k -X POST "https://${CPANEL_HOST}:2087/json-api/cpanel" \
              -H "Authorization: WHM ${USER}:${CPANEL_TOKEN}" \
              --data "cpanel_jsonapi_user=${USER}" \
              --data "cpanel_jsonapi_apimodule=Fileman" \
              --data "cpanel_jsonapi_apifunc=save_file_content" \
              --data "cpanel_jsonapi_version=2" \
              --data-urlencode "dir=${DIR}" \
              --data-urlencode "file=index.html" \
              --data-urlencode "content=${HTML}" \
              --data "charset=utf-8" >/dev/null || echo "WARN :2087 $DIR"
          done
      - name: Verify
        run: |
          set -euo pipefail
          sleep 4
          page="$(curl -fsSL https://120.cash/ || true)"
          if echo "$page" | grep -q '#book' && ! echo "$page" | grep -q 'one working day'; then
            echo "120.cash is brief then pay"
          else
            echo "120.cash still wait-a-day. Need CLOUDFLARE_API_TOKEN or CPANEL_TOKEN repo secret, or laptop install-hub-hook.ps1."
          fi
          pay="$(curl -fsSL https://keychain.gr/pay.html || true)"
          if echo "$pay" | grep -q 'github.io/paid.html' && ! echo "$pay" | grep -Fq "a('https://120.cash/#brief'"; then
            echo "keychain cash_120 returns to paid.html"
          else
            echo "keychain cash_120 still bounces to 120.cash/#brief."
          fi
          agency="$(curl -fsSL https://agency002.com/ || true)"
          if echo "$agency" | grep -Fq 'cash.agency002.com/#book' || echo "$agency" | grep -Fq 'now.agency002.com/#book'; then
            echo "agency002.com €120 card opens an orange night till"
          else
            echo "agency002.com €120 card still sends cash_120 to wait-a-day."
          fi
          exit 0
