# Self-contained Fileman/orange. Does not use workflow_call (put-120cash.yml
# nested schedule never produced a schedule event).
# */15 on this file produced ZERO schedule events (last run 09:54Z, all
# workflow_run from indexnow-tills; indexnow-tills itself stopped scheduling).
# put-catalog-nav `25 * * * *` DID fire (06:12Z and 12:45Z). Follow that cron
# and also Fileman after that workflow succeeds. Do NOT add push.paths —
# that nested filter is why put-120cash.yml never produced a schedule event.
# ping 2026-09-07T13:26Z: chain off put-catalog-nav (proven schedule).
# ping 2026-09-07T13:04Z: probe WHM :2087 even when CPANEL_TOKEN is empty.
# ping 2026-09-07T10:23Z: Fileman origin first. Orange DNS after (token DNS 403).
# Empty secrets skip inside the scripts. Does not replace Workers grok / grok-cf.
name: put-120cash-cron
on:
  schedule:
    - cron: "25 * * * *"
    - cron: "55 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - indexnow-tills
      - put-catalog-nav
    types:
      - completed
jobs:
  put:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard pack parses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          o = Path("ftp-drop/orange-120cash.ps1").read_text()
          i = o.rfind("Write-Host 'Done. Origin")
          if i < 0 or "pass through.'" not in o[i:i+140]:
              raise SystemExit("orange-120cash.ps1 LAST Done is unclosed")
          if "Test-GrokCfHealthy" not in o:
              raise SystemExit("orange-120cash.ps1 missing Test-GrokCfHealthy")
          k = Path("ftp-drop/patch-keychain.py").read_text()
          if "{CHECKOUT_SESSION_ID}" not in k:
              raise SystemExit("patch-keychain.py missing {CHECKOUT_SESSION_ID}")
          sh = Path("ftp-drop/fileman-120cash.sh").read_text()
          if "patch-keychain.py" not in sh or "keychain.gr" not in sh:
              raise SystemExit("fileman-120cash.sh missing keychain pay.html Fileman")
          if "patch-eidotevil.py" not in sh or "patch-sebarv.py" not in sh or "patch-agency.py" not in sh:
              raise SystemExit("fileman-120cash.sh missing catalog €120 Fileman")
          idx = Path("ftp-drop/120-index.html").read_text()
          if 'href="/pay.html' in idx or "href='/pay.html" in idx:
              raise SystemExit("120-index.html relative /pay.html 404s on grey origin")
          if "https://pay.120.cash/pay.html?plan=cash_120" not in idx:
              raise SystemExit("120-index.html Pay CTAs must be absolute pay.120.cash")
          print("orange pack OK")
          PY
      - name: Fileman 120.cash then orange DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          WHM_TOKEN: ${{ secrets.WHM_TOKEN }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_DIR: ${{ secrets.CPANEL_DIR }}
        run: |
          set -euo pipefail
          chmod +x ftp-drop/orange-120cash.sh ftp-drop/fileman-120cash.sh ftp-drop/fileman-save.sh
          ftp-drop/fileman-120cash.sh
          ftp-drop/orange-120cash.sh || true
