# Self-contained Fileman/orange. Does not use workflow_call (put-120cash.yml
# nested schedule never produced a schedule event). indexnow-tills DID get a
# schedule event at 07:31Z, so GitHub cron works on this repo — use */15 like
# cron-alive. Empty secrets skip inside the scripts.
# Does not replace Workers grok / grok-cf.
# Do NOT add push.paths here — that nested filter is why put-120cash.yml
# never produced a schedule event.
# ping 2026-09-07T09:43Z: still zero schedule events; re-register */15. Do not add push.paths.
# ping 2026-09-07T08:42Z: also Fileman after indexnow-tills (hourly :40).
# ping 2026-09-07T10:23Z: Fileman origin first. Orange DNS after (token DNS 403).
name: put-120cash-cron
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["indexnow-tills"]
    types:
      - completed
jobs:
  put:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard pack parses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          o = Path("ftp-drop/orange-120cash.ps1").read_text()
          i = o.rfind("Write-Host 'Done. Origin")
          if i < 0 or "pass through.'" not in o[i:i+140]:
              raise SystemExit("orange-120cash.ps1 LAST Done is unclosed")
          if "Test-GrokCfHealthy" not in o:
              raise SystemExit("orange-120cash.ps1 missing Test-GrokCfHealthy")
          print("orange pack OK")
          PY
      - name: Fileman 120.cash then orange DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_DIR: ${{ secrets.CPANEL_DIR }}
        run: |
          set -euo pipefail
          chmod +x ftp-drop/orange-120cash.sh ftp-drop/fileman-120cash.sh ftp-drop/fileman-save.sh
          ftp-drop/fileman-120cash.sh
          ftp-drop/orange-120cash.sh || true
